# Nominatim local con los datos de Ecuador (para el Mapa de consulta).
# Uso: docker compose -f docker/nominatim/docker-compose.yml up -d
# La primera vez descarga el mapa de Ecuador e importa (30-60 min); el log lo muestra:
#   docker logs -f nominatim
# Listo cuando responde: curl "http://localhost:8080/status"
services:
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Base de datos (solo desde esta máquina): el backend calcula cruces de calles sobre ella.
      # 5433 en el host porque el 5432 suele estar ocupado por otro Postgres.
      - "127.0.0.1:5433:5432"
    environment:
      PBF_URL: https://download.geofabrik.de/south-america/ecuador-latest.osm.pbf
      # Mantiene el servidor al día con las ediciones de OSM (nombres de calles nuevos)
      REPLICATION_URL: https://download.geofabrik.de/south-america/ecuador-updates/
      NOMINATIM_PASSWORD: cambiar-en-produccion
      IMPORT_STYLE: full
      THREADS: 4
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
    shm_size: 1gb

volumes:
  nominatim-data:
